<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Mirrored-primary head-on interaction</title>
  <desc id="desc">An electron primary at minus d travels toward the interaction point. Its same-charge mirrored partner at plus d travels in the opposite direction. Passive electron and positron witnesses are born near the interaction point.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker>
  </defs>
  <rect width="1000" height="320" fill="white"/>
  <g font-family="sans-serif" fill="#172b4d" text-anchor="middle">
    <rect x="125" y="83" width="750" height="164" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 5"/>
    <text x="500" y="31" font-size="23">One tracked source · one same-charge mirror</text>
    <text x="500" y="59" font-size="17">Head-on model; geometry not to scale</text>
    <path d="M65 180 H937" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="948" y="187" font-size="20">z</text>
    <path d="M500 95 V240" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
    <ellipse cx="295" cy="180" rx="62" ry="29" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <ellipse cx="705" cy="180" rx="62" ry="29" fill="#e0e7ff" stroke="#6366f1" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="295" y="187" font-size="22">−Q₀</text>
    <text x="705" y="187" font-size="22">−Q₀</text>
    <path d="M355 144 H425 M645 144 H575" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="295" y="117" font-size="18">Tracked primary</text>
    <text x="705" y="117" font-size="18">Mirrored primary</text>
    <circle cx="484" cy="169" r="5" fill="#b45309"/>
    <circle cx="516" cy="193" r="5" fill="#047857"/>
    <path d="M484 169 L459 132 M516 193 L541 228" stroke="#64748b" stroke-width="1.5"/>
    <text x="445" y="132" font-size="16">e⁻</text>
    <text x="552" y="238" font-size="16">e⁺</text>
    <text x="295" y="232" font-size="19">−d</text>
    <text x="705" y="232" font-size="19">+d</text>
    <text x="500" y="269" font-size="19">IP: z = 0</text>
    <text x="500" y="300" font-size="17">Passive witnesses: individual birth times, no charge deposition or back-reaction</text>
  </g>
</svg>
