project:
  type: website
  output-dir: ../../_site/resources/schools
  render:
    - index.qmd
    - "[0-9][0-9][0-9][0-9]/*.qmd"

website:
  title: "OPALX School Archive"
  search: true
  page-navigation: false
  page-footer:
    center: "School material is linked from each course page."

format:
  html:
    theme:
      light:
        - cosmo
        - ../../assets/styles/opalx-light.scss
        - ../../assets/styles/opalx.scss
      dark:
        - darkly
        - ../../assets/styles/opalx-dark.scss
        - ../../assets/styles/opalx.scss
    toc: true
    code-copy: true
    code-overflow: wrap
    html-math-method: mathjax
    link-external-newwindow: true

documents-base-url: "https://github.com/OPALX-project/opalx-documents/blob/main"
manual-repository-url: "https://github.com/OPALX-project/opalx-manual"
deployment-profile: "opalx"


documents-media-base-url: "https://media.githubusercontent.com/media/OPALX-project/opalx-documents/main"
